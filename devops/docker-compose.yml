services:
  solarcalc-app:
    build:
      context: ..
      dockerfile: devops/Dockerfile
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:mariadb://solarcalc-db:3306/solarcalc
      SPRING_DATASOURCE_USERNAME: solarcalc
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-solarcalc}
      SOLARCALC_JWT_SECRET: ${SOLARCALC_JWT_SECRET}
    restart: unless-stopped
    depends_on:
      solarcalc-db:
        condition: service_healthy

  solarcalc-db:
    image: mariadb:11
    environment:
      MARIADB_DATABASE: solarcalc
      MARIADB_USER: solarcalc
      MARIADB_PASSWORD: ${DB_PASSWORD:-solarcalc}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    ports:
      - "3306:3306"
    volumes:
      - solarcalc-db-data:/var/lib/mysql
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  solarcalc-db-data:
