server:
  port: 8080
  compression:
    enabled: true
    mime-types: application/json
  http2:
    enabled: true

spring:
  main:
    allow-bean-definition-overriding: true
  application:
    name: solar-calc
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:mariadb://localhost:3306/solarcalc
    username: solarcalc
    password: solarcalc
    driver-class-name: org.mariadb.jdbc.Driver
    type: org.apache.tomcat.jdbc.pool.DataSource
    tomcat:
      initial-size: 15
      max-wait: 20000
      default-auto-commit: true
      connection-properties: stringtype=unspecified
      test-on-borrow: true
      validation-query: SELECT 1
      validation-interval: 3000
      max-active: 50
      max-idle: 50
  jpa:
    properties:
      hibernate:
        jdbc:
          batch_size: 500
          batch_versioned_data: true
        order_inserts: true
        order_updates: true
        session:
          events:
            log:
              LOG_QUERIES_SLOWER_THAN_MS: 250
    hibernate:
      ddl-auto: none
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    open-in-view: false
    show-sql: true
  liquibase:
    change-log: classpath:db/db.changelog-master.xml

solarcalc:
  security:
    jwt:
      secret-key: ${SOLARCALC_JWT_SECRET}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
logging:
  config: "classpath:log4j2.xml"
