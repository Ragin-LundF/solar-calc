<div class="flex h-screen bg-background text-foreground">
  <!-- Sidebar -->
  <aside class="flex flex-col w-56 border-r border-border bg-sidebar shrink-0">
    <div class="flex items-center gap-2 px-4 py-4 border-b border-border">
      <span class="text-xl">☀️</span>
      <span class="font-semibold text-sm">SolarCalc</span>
    </div>

    <!-- Tenant selector -->
    <div class="px-3 py-3 border-b border-border">
      <p class="text-xs text-muted-foreground mb-1">{{ 'common.tenantId' | translate }}</p>
      @if (state.tenantId(); as tid) {
        <div class="flex items-center justify-between">
          <span class="text-sm font-medium">ID {{ tid }}</span>
          <button
            class="text-xs text-muted-foreground hover:text-foreground"
            (click)="state.setTenant(null); tenantIdInput = ''"
          >✕</button>
        </div>
      } @else {
        <div class="flex gap-1">
          <input
            type="number"
            [(ngModel)]="tenantIdInput"
            (keydown.enter)="applyTenantId()"
            placeholder="1"
            class="w-full border border-input rounded px-2 py-1 text-xs bg-background"
          />
          <button
            class="px-2 py-1 rounded bg-primary text-primary-foreground text-xs"
            (click)="applyTenantId()"
          >→</button>
        </div>
      }
    </div>

    <nav class="flex-1 px-2 py-3 space-y-1">
      @for (item of navItems; track item.route) {
        <a
          [routerLink]="item.route"
          routerLinkActive="bg-sidebar-accent text-sidebar-accent-foreground"
          class="flex items-center gap-3 px-3 py-2 rounded-md text-sm text-sidebar-foreground hover:bg-sidebar-accent hover:text-sidebar-accent-foreground transition-colors"
        >
          <span class="text-base leading-none">{{ item.icon }}</span>
          <span>{{ item.labelKey | translate }}</span>
        </a>
      }
    </nav>

    <div class="px-4 py-3 border-t border-border">
      <button
        (click)="toggleLang()"
        class="w-full text-left text-xs text-muted-foreground hover:text-foreground transition-colors"
      >
        🌐 {{ currentLang() === 'de' ? 'Deutsch' : 'English' }}
      </button>
    </div>
  </aside>

  <!-- Main content -->
  <main class="flex-1 overflow-y-auto p-6">
    <router-outlet />
  </main>
</div>
