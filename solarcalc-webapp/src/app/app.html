@if (auth.isAuthenticated) {
  <div class="flex h-screen bg-background text-foreground">
    <!-- Sidebar -->
    <aside class="flex flex-col w-60 border-r border-border bg-sidebar shrink-0">
      <div class="flex items-center gap-3 px-5 py-5 border-b border-border">
        <div class="w-8 h-8 rounded-lg bg-primary flex items-center justify-center text-primary-foreground text-lg font-bold">☀</div>
        <div>
          <span class="font-semibold text-sm block leading-tight">SolarCalc</span>
          <span class="text-xs text-muted-foreground">{{ auth.username() }}</span>
        </div>
      </div>

      <nav class="flex-1 px-3 py-4 space-y-1">
        @for (item of navItems; track item.route) {
          <a
            [routerLink]="item.route"
            routerLinkActive="bg-sidebar-accent text-sidebar-accent-foreground font-medium"
            class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm text-sidebar-foreground hover:bg-sidebar-accent hover:text-sidebar-accent-foreground transition-all duration-150"
            [class.router-link-active]="false"
            #rla="routerLinkActive"
          >
            <span class="text-base w-5 text-center">{{ item.icon }}</span>
            <span>{{ item.labelKey | translate }}</span>
          </a>
        }
      </nav>

      <div class="px-4 py-3 border-t border-border space-y-1">
        <button
          (click)="toggleDark()"
          class="w-full flex items-center gap-3 px-3 py-2 rounded-lg text-xs text-muted-foreground hover:text-foreground hover:bg-sidebar-accent transition-colors"
        >
          <span class="text-base w-5 text-center">{{ dark() ? '☀' : '☾' }}</span>
          <span>{{ (dark() ? 'common.lightMode' : 'common.darkMode') | translate }}</span>
        </button>

        <button
          (click)="toggleLang()"
          class="w-full flex items-center gap-3 px-3 py-2 rounded-lg text-xs text-muted-foreground hover:text-foreground hover:bg-sidebar-accent transition-colors"
        >
          <span class="text-base w-5 text-center">🌐</span>
          <span>{{ currentLang() === 'de' ? 'Deutsch' : 'English' }}</span>
        </button>

        <button
          (click)="logout()"
          class="w-full flex items-center gap-3 px-3 py-2 rounded-lg text-xs text-destructive hover:bg-destructive/10 transition-colors"
        >
          <span class="text-base w-5 text-center">🚪</span>
          <span>{{ 'auth.logout' | translate }}</span>
        </button>
      </div>
    </aside>

    <!-- Main content -->
    <main class="flex-1 overflow-y-auto p-8">
      <router-outlet />
    </main>
  </div>
} @else {
  <router-outlet />
}
